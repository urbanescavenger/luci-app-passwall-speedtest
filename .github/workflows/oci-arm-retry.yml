name: oci-arm-retry

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: oci-arm-retry
  cancel-in-progress: true

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Configure OCI CLI
        env:
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_KEY_CONTENT" > "$HOME/.oci/key.pem"
          chmod 600 "$HOME/.oci/key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=$HOME/.oci/key.pem
          EOF
          chmod 600 "$HOME/.oci/config"

          oci iam region list --output table > /dev/null && echo "OCI CLI OK"

      - name: Build launch.json
        env:
          COMPARTMENT: ${{ secrets.OCI_COMPARTMENT }}
          AD: ${{ secrets.OCI_AD }}
          IMAGE: ${{ secrets.OCI_IMAGE }}
          SUBNET: ${{ secrets.OCI_SUBNET }}
          SSH_PUBKEY: ${{ secrets.OCI_SSH_PUBKEY }}
        run: |
          jq -n \
            --arg c "$COMPARTMENT" \
            --arg ad "$AD" \
            --arg img "$IMAGE" \
            --arg sn "$SUBNET" \
            --arg key "$SSH_PUBKEY" \
            '{
              compartmentId: $c,
              availabilityDomain: $ad,
              shape: "VM.Standard.A1.Flex",
              shapeConfig: { ocpus: 1, memoryInGBs: 6 },
              imageId: $img,
              subnetId: $sn,
              assignPublicIp: true,
              displayName: "free-arm-1",
              metadata: { ssh_authorized_keys: $key }
            }' > "$RUNNER_TEMP/launch.json"

      - name: Retry loop
        id: loop
        env:
          COMPARTMENT: ${{ secrets.OCI_COMPARTMENT }}
        run: |
          deadline=$(( $(date +%s) + 18000 ))   # 5 小时
          attempt=0

          while [ "$(date +%s)" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            echo "[$(date '+%F %T')] 第 $attempt 次尝试"

            existing=$(oci compute instance list \
              --compartment-id "$COMPARTMENT" \
              --query 'data[?"display-name"==`free-arm-1` && "lifecycle-state"!=`TERMINATED`].id' \
              --raw-output 2>/dev/null)
            if [ -n "$existing" ]; then
              echo "实例已存在：$existing"
              echo "stop=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if oci compute instance launch \
                --from-json "file://$RUNNER_TEMP/launch.json" \
                --no-retry --output json > "$RUNNER_TEMP/launch.log" 2>&1; then
              echo "✅ 创建成功"
              instance_id=$(jq -r '.id' "$RUNNER_TEMP/launch.log")
              echo "instance: $instance_id"
              ip=$(oci compute instance list-vnics --instance-id "$instance_id" \
                --query 'data[0]."public-ip"' --raw-output 2>/dev/null || true)
              echo "public ip: $ip"
              echo "stop=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if grep -qi "Out of host capacity" "$RUNNER_TEMP/launch.log"; then
              echo "  容量不足，等下一轮"
              sleep $((540 + RANDOM % 120))
            elif grep -qi "Too many requests" "$RUNNER_TEMP/launch.log"; then
              echo "  被限流，等 15 分钟"
              sleep 900
            else
              echo "  其他错误："
              cat "$RUNNER_TEMP/launch.log"
              sleep 300
            fi
          done

          echo "本轮 5 小时结束，续链"
          echo "chain=true" >> "$GITHUB_OUTPUT"

      - name: Disable workflow on success
        if: steps.loop.outputs.stop == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow disable oci-arm-retry.yml || true

      - name: Chain next run
        if: steps.loop.outputs.chain == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run oci-arm-retry.yml --repo "$GITHUB_REPOSITORY"
